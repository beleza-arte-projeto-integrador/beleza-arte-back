# Banco PostgreSQL local para desenvolvimento.
# Ligar:      docker compose up -d
# Desligar:   docker compose down
# Zerar tudo: docker compose down -v   (apaga os dados)
services:
  postgres:
    image: postgres:17
    container_name: salaobeleza-db
    environment:
      POSTGRES_DB: salaobeleza
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
