# Perfil "dev": usa o PostgreSQL local do docker-compose.yml.
# Ativar com a variavel de ambiente SPRING_PROFILES_ACTIVE=dev
# Sem esse perfil, a aplicacao continua usando o banco do Supabase (application.properties).

spring.datasource.url=jdbc:postgresql://localhost:5432/salaobeleza
spring.datasource.username=dev
spring.datasource.password=dev

# Flyway cria as tabelas a partir dos scripts em src/main/resources/db/migration
spring.flyway.enabled=true

# O Hibernate so confere se as entidades batem com as tabelas (nao altera nada).
# Se der erro de "Schema-validation", alguma entidade esta diferente do script SQL.
spring.jpa.hibernate.ddl-auto=validate
