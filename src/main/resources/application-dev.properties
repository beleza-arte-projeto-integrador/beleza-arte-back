# Perfil "dev": usa o PostgreSQL local do docker-compose.yml.
# Ativar com: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# Sem esse perfil, a aplicacao usa o banco do Supabase (application.properties).
# O resto da configuracao (Flyway, Hibernate) vem do application.properties.

spring.datasource.url=jdbc:postgresql://localhost:5432/salaobeleza
spring.datasource.username=dev
spring.datasource.password=dev
