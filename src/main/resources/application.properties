spring.application.name=salaobeleza
server.port=8081
api.version=v1
api.module=salao
server.servlet.context-path=/${api.version}/api/${api.module}

# Logs
logging.level.org.springframework=INFO

# Conexao com Supabase (Pooler AWS)
# Porta 5432 = "session pooler" do Supabase, necessaria para o Flyway.
spring.datasource.url=jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.agdkfnhatojkohpivelx
spring.datasource.password=J9NVRBwVuEL7JohU
spring.datasource.driver-class-name=org.postgresql.Driver
# Poucas conexoes por pessoa: o plano gratuito do Supabase tem limite de conexoes
# e varias pessoas do grupo podem rodar a aplicacao ao mesmo tempo.
spring.datasource.hikari.maximum-pool-size=3

# Flyway cria e atualiza as tabelas a partir dos scripts em src/main/resources/db/migration
spring.flyway.enabled=true

# JPA / Hibernate
# O Hibernate so confere se as entidades batem com as tabelas (nao altera nada).
# Se der erro de "Schema-validation", alguma entidade esta diferente dos scripts SQL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true