spring.application.name=salaobeleza
server.port=8081
api.version=v1
api.module=salao
server.servlet.context-path=/${api.version}/api/${api.module}
spring.datasource.hikari.data-source-properties.prepareThreshold=0
# Logs
logging.level.org.springframework=INFO

# Conexao com Supabase (Pooler AWS)
# Os valores vem de variaveis de ambiente ou do arquivo .env na raiz do projeto
# (copie o .env.example para .env e preencha). O .env nao vai para o git.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Poucas conexoes por pessoa: o plano gratuito do Supabase tem limite de conexoes
# e varias pessoas do grupo podem rodar a aplicacao ao mesmo tempo.
spring.datasource.hikari.maximum-pool-size=3

# JPA / Hibernate
# As tabelas sao criadas e alteradas direto no Supabase.
# "none": o Hibernate nao cria nem altera nada no banco, so usa as tabelas que existem.
# Se der erro de "column does not exist", alguma entidade esta diferente da tabela no Supabase.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
# Swagger (documentação dos endpoints): http://localhost:8081/v1/api/salao/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.docExpansion=none
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.urlsPrimaryName=1-todos
